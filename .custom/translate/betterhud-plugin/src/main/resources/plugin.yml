name: BetterHud
version: '${project.version}'
main: kr.toxicity.hud.bukkit.BetterHudPlugin
api-version: '1.20'
description: Custom HUD plugin using boss bars and resource packs
authors: [Translated-to-Java]
commands:
  betterhud:
    description: BetterHud main command
    usage: /betterhud <reload|hud|popup|compass>
    permission: betterhud.admin
permissions:
  betterhud.admin:
    description: Access to all BetterHud commands
    default: op
